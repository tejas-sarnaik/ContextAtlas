[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "contextatlas"
version = "0.1.0"
description = "Local-first context budget laboratory for explainable RAG selection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name="Tejas Sarnaik",email="tejassarnaik2120@gmail.com"}]
keywords = ["rag", "nlp", "context-window", "information-retrieval", "explainable-ai"]
[project.scripts]
contextatlas = "contextatlas.cli:main"
[tool.setuptools]
packages = ["contextatlas"]
[tool.setuptools.package-data]
contextatlas = []
